<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Cover & Disc</title>
    <link rel="stylesheet" href="https://public.codepenassets.com/css/reset-2.0.min.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  
  <body>

    <!-- Single album: click to slide the vinyl out, click again to start spinning -->
    <div class="album album--boxer" data-album aria-label="Album cover" role="button" tabindex="0">
      <div class="album__cover" aria-hidden="true"></div>
      <div class="vinyl" aria-hidden="true">
        <div class="vinyl__shadow"></div>
        <div class="vinyl__circle">
          <div class="vinyl__center"></div>
        </div>
      </div>
    </div>

    <script src="./script.js"></script>

  </body>

</html>
